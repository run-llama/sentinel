<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel — AI Agent Monitor</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #121722;
      --surface-2: #181f2e;
      --border: #252f45;
      --text: #e6edf7;
      --muted: #8b9bb4;
      --ok: #22c55e;
      --info: #38bdf8;
      --warning: #f59e0b;
      --critical: #ef4444;
      --accent: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 14, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
    }
    .pulse.scanning {
      background: var(--info);
      box-shadow: 0 0 12px var(--info);
      animation: blink 0.9s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #202a3f; border-color: #3a4a6b; }
    button.primary {
      background: #4f46e5;
      border-color: #6366f1;
    }
    button.primary:hover { background: #4338ca; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    label.toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 24px 48px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-val { font-size: 26px; font-weight: 700; margin-top: 2px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 4px solid var(--border);
    }
    .card.sev-ok { border-left-color: var(--ok); }
    .card.sev-info { border-left-color: var(--info); }
    .card.sev-warning { border-left-color: var(--warning); }
    .card.sev-critical { border-left-color: var(--critical); box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.25); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .title-wrap { min-width: 0; flex: 1; }
    .title {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-agent { background: rgba(129, 140, 248, 0.16); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.35); }
    .badge-ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .badge-info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
    .badge-warning { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
    .badge-critical { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .grade-box {
      min-width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .grade-letter { font-size: 20px; font-weight: 800; line-height: 1; }
    .grade-score { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .verdict-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .goal {
      font-size: 12px;
      color: var(--muted);
    }
    .goal strong { color: var(--text); font-weight: 600; }
    .summary { font-size: 14px; }
    .evidence {
      margin: 0;
      padding-left: 18px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .evidence li { margin-bottom: 3px; }
    .rec {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: #c7d2fe;
    }
    .mistakes {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: #fde68a;
    }
    .mistakes ul { margin: 4px 0 0; padding-left: 18px; }
    .tell-agent {
      background: rgba(129, 140, 248, 0.12);
      border: 1px solid rgba(129, 140, 248, 0.38);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: #e0e7ff;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .badge-diff-yes { background: rgba(34, 197, 94, 0.14); color: #4ade80; }
    .badge-diff-partial { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
    .badge-diff-mismatch { background: rgba(239, 68, 68, 0.22); color: #f87171; }
    .badge-diff-none { background: rgba(139, 155, 180, 0.14); color: var(--muted); }
    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 4px;
    }
    .btn-group { display: flex; gap: 6px; }
    .btn-sm { padding: 5px 9px; font-size: 12px; }
    details {
      background: #0d111a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }
    summary { cursor: pointer; color: var(--muted); user-select: none; }
    pre {
      margin: 8px 0 0;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #cbd5e1;
    }
    .history-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item {
      display: flex;
      gap: 8px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .err {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .interval-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .interval-control input[type="number"] {
      width: 54px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12.5px;
      text-align: right;
    }
    .interval-control select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
    }
    .pulse.paused {
      background: var(--muted);
      box-shadow: none;
    }
    .stat-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
    }
    .model-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .model-bar label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .model-bar select,
    .model-bar input[type="text"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .model-bar input[type="text"] {
      min-width: 240px;
      flex: 1;
      max-width: 360px;
    }
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div id="pulse" class="pulse"></div>
      <div>
        <h1>Sentinel</h1>
        <div id="headerMeta" class="meta">Connecting...</div>
      </div>
    </div>
    <div class="controls">
      <label class="toggle">
        <input id="toggleLive" type="checkbox" checked />
        Live Watch
      </label>
      <div class="interval-control" title="Auto-scan interval in seconds (min 5s)">
        <span>Every</span>
        <input id="inputInterval" type="number" min="5" max="3600" step="5" value="30" />
        <span>s</span>
        <select id="presetInterval" aria-label="Interval presets">
          <option value="">Presets</option>
          <option value="10">10s</option>
          <option value="15">15s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
          <option value="120">2m</option>
          <option value="300">5m</option>
        </select>
      </div>
      <label class="toggle">
        <input id="toggleAll" type="checkbox" />
        All shells
      </label>
      <label class="toggle">
        <input id="toggleNotify" type="checkbox" checked />
        Alerts
      </label>
      <button id="btnScan">Scan Now</button>
      <button id="btnForce" class="primary">Re-grade All</button>
    </div>
  </header>

  <main>
    <section class="model-bar">
      <label for="selectProvider">Auditor</label>
      <select id="selectProvider" aria-label="Auditor provider">
        <option value="auto">Auto</option>
        <option value="google">Google Gemini</option>
        <option value="openrouter">OpenRouter</option>
        <option value="ollama">Ollama (Local)</option>
      </select>
      <select id="selectPreset" aria-label="Model preset">
        <option value="">Choose preset…</option>
      </select>
      <input
        id="inputModel"
        type="text"
        placeholder="Any OpenRouter ID (e.g. anthropic/claude-haiku-5.5) or Ollama model"
      />
      <button id="btnApplyModel" class="btn-sm primary">Apply Model</button>
      <button id="btnRefreshModels" class="btn-sm" title="Refresh local Ollama models">Refresh Ollama</button>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Monitored</div>
        <div id="statTotal" class="stat-val">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Going Well / Done</div>
        <div id="statOk" class="stat-val" style="color: var(--ok)">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Warnings</div>
        <div id="statWarn" class="stat-val" style="color: var(--warning)">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Critical</div>
        <div id="statCrit" class="stat-val" style="color: var(--critical)">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Auditor Cost</div>
        <div id="statCost" class="stat-val" style="color: var(--accent)">$0.0000</div>
        <div id="statCostSub" class="stat-sub">0 calls · 0 tokens</div>
      </div>
    </section>

    <section id="grid" class="grid"></section>
  </main>

  <script>
    const gridEl = document.getElementById("grid");
    const pulseEl = document.getElementById("pulse");
    const headerMetaEl = document.getElementById("headerMeta");
    const toggleLiveEl = document.getElementById("toggleLive");
    const inputIntervalEl = document.getElementById("inputInterval");
    const presetIntervalEl = document.getElementById("presetInterval");
    const toggleAllEl = document.getElementById("toggleAll");
    const toggleNotifyEl = document.getElementById("toggleNotify");
    const btnScanEl = document.getElementById("btnScan");
    const btnForceEl = document.getElementById("btnForce");
    const selectProviderEl = document.getElementById("selectProvider");
    const selectPresetEl = document.getElementById("selectPreset");
    const inputModelEl = document.getElementById("inputModel");
    const btnApplyModelEl = document.getElementById("btnApplyModel");
    const btnRefreshModelsEl = document.getElementById("btnRefreshModels");

    let latestState = null;
    let modelCatalog = { presets: [], ollamaModels: [] };

    async function loadModelCatalog() {
      try {
        const resp = await fetch("/api/models");
        if (!resp.ok) return;
        modelCatalog = await resp.json();
        const presetOptions = (modelCatalog.presets || [])
          .map((p) => `<option value="${esc(p.id)}" data-provider="${esc(p.provider)}">${esc(p.label)}</option>`)
          .join("");
        const ollamaOptions = (modelCatalog.ollamaModels || []).length
          ? `<optgroup label="Local Ollama (${esc(modelCatalog.ollamaBaseUrl)})">${modelCatalog.ollamaModels
              .map((m) => `<option value="${esc(m)}" data-provider="ollama">${esc(m)} (Local $0)</option>`)
              .join("")}</optgroup>`
          : `<optgroup label="Local Ollama (not running / no models)"></optgroup>`;
        selectPresetEl.innerHTML =
          `<option value="">Select preset…</option>` +
          `<optgroup label="Cloud Presets">${presetOptions}</optgroup>` +
          ollamaOptions;
      } catch {}
    }
    loadModelCatalog();

    function fmtUsd(v) {
      const n = Number(v) || 0;
      if (n >= 1) return "$" + n.toFixed(2);
      if (n >= 0.01) return "$" + n.toFixed(4);
      return "$" + n.toFixed(4);
    }

    function fmtTokens(n) {
      const num = Number(n) || 0;
      if (num >= 1_000_000) return (num / 1_000_000).toFixed(2) + "M";
      if (num >= 1_000) return (num / 1_000).toFixed(1) + "k";
      return String(num);
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmtVerdict(v) {
      return String(v || "unknown").replace(/_/g, " ");
    }

    function fmtTime(iso) {
      if (!iso) return "—";
      try { return new Date(iso).toLocaleTimeString(); } catch { return iso; }
    }

    function sevColor(sev) {
      if (sev === "ok") return "var(--ok)";
      if (sev === "warning") return "var(--warning)";
      if (sev === "critical") return "var(--critical)";
      return "var(--info)";
    }

    async function post(url) {
      await fetch(url, { method: "POST" });
    }

    async function patchConfig(patch) {
      await fetch("/api/config", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
    }

    btnScanEl.onclick = () => post("/api/scan");
    btnForceEl.onclick = () => post("/api/scan?force=1");
    toggleLiveEl.onchange = () => patchConfig({ liveWatch: toggleLiveEl.checked });
    inputIntervalEl.onchange = () => {
      const sec = Math.max(5, Math.min(3600, Math.round(Number(inputIntervalEl.value) || 30)));
      inputIntervalEl.value = String(sec);
      patchConfig({ pollIntervalMs: sec * 1000 });
    };
    presetIntervalEl.onchange = () => {
      const sec = Number(presetIntervalEl.value);
      if (sec >= 5) {
        inputIntervalEl.value = String(sec);
        patchConfig({ pollIntervalMs: sec * 1000, liveWatch: true });
      }
      presetIntervalEl.value = "";
    };
    toggleAllEl.onchange = () => patchConfig({ includeAllTerminals: toggleAllEl.checked });
    toggleNotifyEl.onchange = () => patchConfig({ notifyOnBadVerdict: toggleNotifyEl.checked });
    selectPresetEl.onchange = () => {
      const opt = selectPresetEl.selectedOptions[0];
      const modelId = selectPresetEl.value;
      if (!modelId) return;
      const prov = opt?.dataset?.provider || "auto";
      selectProviderEl.value = prov;
      inputModelEl.value = modelId;
      patchConfig({ provider: prov, model: modelId });
      selectPresetEl.value = "";
    };
    selectProviderEl.onchange = () => {
      patchConfig({ provider: selectProviderEl.value });
    };
    btnApplyModelEl.onclick = () => {
      const model = inputModelEl.value.trim();
      if (!model) return;
      patchConfig({ provider: selectProviderEl.value, model });
    };
    inputModelEl.onkeydown = (e) => {
      if (e.key === "Enter") btnApplyModelEl.click();
    };
    btnRefreshModelsEl.onclick = () => loadModelCatalog();

    function updateHeaderMeta() {
      if (!latestState) return;
      const state = latestState;
      let nextStr = "Paused";
      if (state.isScanning) {
        nextStr = "Scanning now...";
      } else if (state.config.liveWatch && state.nextPollAt) {
        const rem = Math.max(0, Math.ceil((Date.parse(state.nextPollAt) - Date.now()) / 1000));
        nextStr = `Next scan in ${rem}s`;
      } else if (state.config.liveWatch) {
        nextStr = `Every ${Math.round(state.config.pollIntervalMs / 1000)}s`;
      }
      headerMetaEl.textContent = `Model: ${state.config.model} · Poll #${state.pollCount} · ${nextStr} · Updated: ${fmtTime(state.lastPollAt)}`;
    }
    setInterval(updateHeaderMeta, 1000);

    window.focusTerm = (id) => post(`/api/terminals/${encodeURIComponent(id)}/focus`);
    window.regradeTerm = (id) => post(`/api/terminals/${encodeURIComponent(id)}/analyze`);
    window.copyMsg = (btn, text) => {
      navigator.clipboard?.writeText(text);
      const orig = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = orig; }, 1200);
    };

    function diffBadgeHtml(status) {
      if (status === "yes") return `<span class="badge badge-diff-yes">diff matches</span>`;
      if (status === "partial") return `<span class="badge badge-diff-partial">partial diff match</span>`;
      if (status === "mismatch") return `<span class="badge badge-diff-mismatch">diff mismatch</span>`;
      return `<span class="badge badge-diff-none">no diff</span>`;
    }

    function render(state) {
      latestState = state;
      pulseEl.className = "pulse" + (state.isScanning ? " scanning" : !state.config.liveWatch ? " paused" : "");
      updateHeaderMeta();
      toggleLiveEl.checked = Boolean(state.config.liveWatch);
      if (document.activeElement !== inputIntervalEl) {
        inputIntervalEl.value = String(Math.round((state.config.pollIntervalMs || 30000) / 1000));
      }
      toggleAllEl.checked = Boolean(state.config.includeAllTerminals);
      toggleNotifyEl.checked = Boolean(state.config.notifyOnBadVerdict);
      if (document.activeElement !== selectProviderEl) {
        selectProviderEl.value = state.config.provider || "auto";
      }
      if (document.activeElement !== inputModelEl) {
        inputModelEl.value = state.config.model || "";
      }

      const cost = state.cost || { totalCostUsd: 0, totalCalls: 0, totalPromptTokens: 0, totalCompletionTokens: 0 };
      document.getElementById("statCost").textContent = fmtUsd(cost.totalCostUsd);
      document.getElementById("statCostSub").textContent =
        `${cost.totalCalls} call${cost.totalCalls === 1 ? "" : "s"} · ${fmtTokens(cost.totalPromptTokens)} in / ${fmtTokens(cost.totalCompletionTokens)} out`;

      const terms = state.terminals || [];
      const counts = { ok: 0, warn: 0, crit: 0 };
      for (const t of terms) {
        const s = t.analysis?.severity;
        if (s === "ok") counts.ok++;
        else if (s === "warning") counts.warn++;
        else if (s === "critical") counts.crit++;
      }
      document.getElementById("statTotal").textContent = String(terms.length);
      document.getElementById("statOk").textContent = String(counts.ok);
      document.getElementById("statWarn").textContent = String(counts.warn);
      document.getElementById("statCrit").textContent = String(counts.crit);

      if (terms.length === 0) {
        gridEl.innerHTML = `<div class="empty">No active agent terminals detected in Apple Terminal.app.<br/>Enable "Show non-agent shells" to monitor all windows.</div>`;
        return;
      }

      gridEl.innerHTML = terms.map((t) => {
        const a = t.analysis;
        const sev = a?.severity || "info";
        const title = t.customTitle && t.customTitle !== "Terminal" ? t.customTitle : t.windowName;
        const gradeLetter = a?.grade || (t.analyzing ? "…" : "-");
        const gradeScore = a ? `${a.score}/100` : (t.analyzing ? "grading" : "pending");
        const verdictBadge = a
          ? `<span class="badge badge-${esc(sev)}">${esc(fmtVerdict(a.verdict))}</span>`
          : `<span class="badge badge-info">${t.analyzing ? "analyzing..." : "pending"}</span>`;

        const evidenceHtml = a?.evidence?.length
          ? `<ul class="evidence">${a.evidence.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`
          : "";

        const historyHtml = t.history?.length > 1
          ? `<details><summary>Verdict history (${t.history.length})</summary><div class="history-list">${t.history.slice(0, 8).map((h) =>
              `<div class="history-item"><span>${esc(fmtTime(h.analyzedAt))}</span><strong style="color:${sevColor(h.severity)}">${esc(fmtVerdict(h.verdict))} (${esc(h.grade)})</strong><span>${esc(h.summary)}</span></div>`
            ).join("")}</div></details>`
          : "";

        const mistakesHtml = a?.potentialMistakes?.length
          ? `<div class="mistakes"><strong>Potential mistakes:</strong><ul>${a.potentialMistakes.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div>`
          : "";

        const tellAgentHtml = a?.messageToAgent
          ? `<div class="tell-agent"><div><strong>Tell agent:</strong> ${esc(a.messageToAgent)}</div><button class="btn-sm" onclick="copyMsg(this, ${esc(JSON.stringify(a.messageToAgent))})">Copy</button></div>`
          : "";

        const gitDetailsHtml = t.git
          ? `<details><summary>Git workspace: ${esc(t.git.branch)} (${t.git.changedFileCount} changed files)</summary><pre>${esc([t.git.statusShort || "(clean)", "", t.git.diffSnippet || "(no uncommitted diff)"].join("\n"))}</pre></details>`
          : "";

        return `
          <article class="card sev-${esc(sev)}">
            <div class="card-top">
              <div class="title-wrap">
                <div class="title">${esc(title)}</div>
                <div class="sub">
                  <span class="badge badge-agent">${esc(t.detectedAgent)}</span>
                  <span>${esc(t.tty || `win ${t.windowId}`)}</span>
                  <span>${t.busy ? "busy" : "idle"}</span>
                  <span>unchanged ${t.unchangedSeconds}s</span>
                </div>
              </div>
              <div class="grade-box" style="border-color:${sevColor(sev)}">
                <div class="grade-letter" style="color:${sevColor(sev)}">${esc(gradeLetter)}</div>
                <div class="grade-score">${esc(gradeScore)}</div>
              </div>
            </div>

            <div class="verdict-row">
              <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                ${verdictBadge}
                ${a ? diffBadgeHtml(a.diffMatchesClaims) : ""}
              </div>
              <span class="meta">${a ? `graded ${fmtTime(a.analyzedAt)} · ${(a.latencyMs / 1000).toFixed(1)}s${a.usage ? ` · ${fmtUsd(a.usage.costUsd)}` : ""}` : ""}</span>
            </div>

            ${a?.taskGoal ? `<div class="goal"><strong>Goal:</strong> ${esc(a.taskGoal)}</div>` : ""}
            ${a?.summary ? `<div class="summary">${esc(a.summary)}</div>` : ""}
            ${evidenceHtml}
            ${mistakesHtml}
            ${tellAgentHtml}
            ${a?.recommendation ? `<div class="rec"><strong>Next:</strong> ${esc(a.recommendation)}</div>` : ""}
            ${t.lastError ? `<div class="err">${esc(t.lastError)}</div>` : ""}

            ${gitDetailsHtml}

            <details>
              <summary>Live terminal screen (${t.latestContents.length} chars)</summary>
              <pre>${esc(t.latestContents.slice(-3000))}</pre>
            </details>

            ${historyHtml}

            <div class="card-actions">
              <span class="meta">${esc(t.processes.join(" › "))}</span>
              <div class="btn-group">
                <button class="btn-sm" onclick="focusTerm('${esc(t.id)}')">Focus Terminal</button>
                <button class="btn-sm" onclick="regradeTerm('${esc(t.id)}')" ${t.analyzing ? "disabled" : ""}>Re-grade</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    const ev = new EventSource("/api/events");
    ev.onmessage = (msg) => {
      try { render(JSON.parse(msg.data)); } catch {}
    };
    ev.onerror = () => {
      headerMetaEl.textContent = "Reconnecting to DisruptionWatcher...";
    };
  </script>
</body>
</html>
